name: geopin-test
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: geopin
      POSTGRES_USER: geopin
      POSTGRES_PASSWORD: geopin-test
    volumes:
      - postgres-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopin -d geopin"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: geopin-app:local
    build: .
    ports:
      - "127.0.0.1:${GEOPIN_HTTP_PORT:-${TRIXLOG_HTTP_PORT:-18081}}:8080"
    environment:
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}
      JAVA_OPTS: >-
        -Ddb.url=jdbc:postgresql://db:5432/geopin
        -Ddb.username=geopin
        -Ddb.password=geopin-test
        -Ddb.schema-action=${GEOPIN_SCHEMA_ACTION:-${TRIXLOG_SCHEMA_ACTION:-update}}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
volumes:
  postgres-test:
